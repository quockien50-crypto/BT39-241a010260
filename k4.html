
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K4 - Phân Trang Danh Sách</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
        }

        h1 {
            text-align: center;
            color: #4338ca;
        }

        #danhSach {
            list-style: none;
            padding: 0;
        }

        #danhSach li {
            padding: 14px;
            margin-bottom: 8px;
            background-color: #f3f4f6;
            border-radius: 6px;
        }

        #phanTrang {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        #phanTrang button {
            padding: 10px 15px;
            border: 1px solid #4f46e5;
            border-radius: 6px;
            background-color: white;
            color: #4f46e5;
            cursor: pointer;
        }

        #phanTrang button.active {
            background-color: #4f46e5;
            color: white;
        }

        #phanTrang button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #thongTin {
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Phân Trang Danh Sách</h1>

        <p id="thongTin"></p>

        <ul id="danhSach"></ul>

        <div id="phanTrang"></div>
    </div>

    <script>
        // Tạo danh sách gồm 50 mục
        const danhSach = [];

        for (let i = 1; i <= 50; i++) {
            danhSach.push("Mục " + i);
        }

        const soMucMoiTrang = 10;
        const tongSoTrang = Math.ceil(
            danhSach.length / soMucMoiTrang
        );

        let trangHienTai = 1;

        // Hiển thị danh sách của trang hiện tại
        function hienThiDanhSach() {
            const danhSachHTML = document.getElementById("danhSach");
            danhSachHTML.innerHTML = "";

            const viTriBatDau =
                (trangHienTai - 1) * soMucMoiTrang;

            const viTriKetThuc =
                viTriBatDau + soMucMoiTrang;

            const danhSachTrang = danhSach.slice(
                viTriBatDau,
                viTriKetThuc
            );

            danhSachTrang.forEach(function (muc) {
                const li = document.createElement("li");
                li.textContent = muc;
                danhSachHTML.appendChild(li);
            });

            document.getElementById("thongTin").textContent =
                "Trang " + trangHienTai + " / " + tongSoTrang
                + " — Hiển thị " + (viTriBatDau + 1)
                + " đến "
                + Math.min(viTriKetThuc, danhSach.length)
                + " trong tổng số " + danhSach.length + " mục.";

            hienThiNutPhanTrang();
        }

        // Tạo các nút phân trang
        function hienThiNutPhanTrang() {
            const phanTrang = document.getElementById("phanTrang");
            phanTrang.innerHTML = "";

            // Nút Trang trước
            const nutTruoc = document.createElement("button");
            nutTruoc.textContent = "Trước";
            nutTruoc.disabled = trangHienTai === 1;

            nutTruoc.onclick = function () {
                if (trangHienTai > 1) {
                    trangHienTai--;
                    hienThiDanhSach();
                }
            };

            phanTrang.appendChild(nutTruoc);

            // Các nút số trang
            for (let i = 1; i <= tongSoTrang; i++) {
                const nut = document.createElement("button");
                nut.textContent = i;

                if (i === trangHienTai) {
                    nut.classList.add("active");
                }

                nut.onclick = function () {
                    trangHienTai = i;
                    hienThiDanhSach();
                };

                phanTrang.appendChild(nut);
            }

            // Nút Trang sau
            const nutSau = document.createElement("button");
            nutSau.textContent = "Sau";
            nutSau.disabled = trangHienTai === tongSoTrang;

            nutSau.onclick = function () {
                if (trangHienTai < tongSoTrang) {
                    trangHienTai++;
                    hienThiDanhSach();
                }
            };

            phanTrang.appendChild(nutSau);
        }

        // Hiển thị trang đầu tiên khi mở trang web
        hienThiDanhSach();
    </script>

</body>
</html>
