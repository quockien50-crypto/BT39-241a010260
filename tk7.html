
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập TK7 - Tạo chuỗi ngẫu nhiên</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
        }

        h1 {
            color: #4338ca;
        }

        #ketQua {
            font-size: 26px;
            font-weight: bold;
            color: #15803d;
            background: #f0fdf4;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            overflow-wrap: anywhere;
        }

        button {
            padding: 12px 24px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #3730a3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tạo chuỗi ngẫu nhiên</h1>
        <p>Tạo mật khẩu gồm 8 ký tự, bao gồm chữ thường và số.</p>

        <div id="ketQua">Nhấn nút để tạo mật khẩu</div>

        <button onclick="taoChuoiNgauNhien()">
            Tạo mật khẩu
        </button>
    </div>

    <script>
        function taoChuoiNgauNhien() {
            const kyTu = "abcdefghijklmnopqrstuvwxyz0123456789";
            let matKhau = "";

            for (let i = 0; i < 8; i++) {
                const viTri = Math.floor(Math.random() * kyTu.length);
                matKhau += kyTu[viTri];
            }

            document.getElementById("ketQua").textContent = matKhau;
        }
    </script>

</body>
</html>
