    
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K6 - Xử lý sự kiện bàn phím</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
        }

        #khung {
            position: relative;
            width: 100%;
            height: 350px;
            margin-top: 20px;
            background-color: #e5e7eb;
            border: 2px solid #9ca3af;
            border-radius: 8px;
            overflow: hidden;
        }

        #khoi {
            position: absolute;
            width: 60px;
            height: 60px;
            left: 50%;
            top: 145px;
            transform: translateX(-50%);
            background-color: #4f46e5;
            border-radius: 8px;
        }

        p {
            color: #374151;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Xử lý sự kiện bàn phím</h1>

        <p>Nhấn phím ↑ để đi lên, phím ↓ để đi xuống.</p>

        <div id="khung">
            <div id="khoi"></div>
        </div>

        <p id="thongBao">Vị trí: 145px</p>
    </div>

    <script>
        const khoi = document.getElementById("khoi");
        const thongBao = document.getElementById("thongBao");

        let viTriY = 145;
        const buocDiChuyen = 10;
        const chieuCaoKhoi = 60;

        document.addEventListener("keydown", function(event) {
            const khung = document.getElementById("khung");
            const chieuCaoKhung = khung.clientHeight;

            if (event.key === "ArrowUp") {
                viTriY -= buocDiChuyen;
            } else if (event.key === "ArrowDown") {
                viTriY += buocDiChuyen;
            } else {
                return;
            }

            // Không cho khối đi ra ngoài khung
            const viTriToiDa = chieuCaoKhung - chieuCaoKhoi;
            viTriY = Math.max(0, Math.min(viTriY, viTriToiDa));

            khoi.style.top = viTriY + "px";

            thongBao.textContent = "Vị trí: " + viTriY + "px";
        });
    </script>

</body>
</html>
